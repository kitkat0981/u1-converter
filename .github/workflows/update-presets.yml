name: Update preset data

# Every Monday: rebuild data/presets.json.gz from the latest Bambu Studio and Snapmaker Orca
# releases. If the data really changed and the tests pass, open a pull request with it.
# Merging that pull request rebuilds the Docker image. If the tests fail, nothing is opened
# and GitHub emails the repository owner.
#
# Requires: Settings → Actions → General → Workflow permissions →
# "Allow GitHub Actions to create and approve pull requests".
on:
  schedule:
    - cron: '17 7 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python3 tools/update-presets.py
      - run: npm test
      - name: Open a pull request if the data changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Compare the decompressed data: gzip bytes differ between zlib versions even when the data is identical.
          git show HEAD:data/presets.json.gz | gunzip > /tmp/old.json
          gunzip -c data/presets.json.gz > /tmp/new.json
          if cmp -s /tmp/old.json /tmp/new.json; then
            echo "No upstream changes."
            git checkout -- data/presets.json.gz
            exit 0
          fi
          meta=$(python3 -c "import json;m=json.load(open('/tmp/new.json'))['meta'];print(m['bambu']+', '+m['snapmaker'])")
          branch="preset-data/$(date -u +%Y-%m-%d)"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then echo "Branch $branch already exists."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git commit -m "Update preset data ($meta)" -- data/presets.json.gz
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "Update preset data ($meta)" \
            --body "Weekly refresh from the latest Bambu Studio and Snapmaker Orca releases. Tests passed. Merging rebuilds the Docker image."
