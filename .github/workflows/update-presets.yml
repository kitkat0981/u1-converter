name: Update preset data

# Every Monday: rebuild data/presets.json.gz from the latest Bambu Studio and Snapmaker Orca
# releases. If anything changed and the tests pass, commit it and rebuild the Docker image.
# If the tests fail, nothing is committed and GitHub emails the repository owner.
on:
  schedule:
    - cron: '17 7 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python3 tools/update-presets.py
      - run: npm test
      - name: Commit if the data changed
        id: commit
        run: |
          if git diff --quiet -- data/presets.json.gz; then
            echo "No upstream changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          meta=$(python3 -c "import gzip,json;m=json.loads(gzip.open('data/presets.json.gz').read())['meta'];print(m['bambu']+', '+m['snapmaker'])")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update preset data ($meta)" -- data/presets.json.gz
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Rebuild the image
        if: steps.commit.outputs.changed == 'true'
        run: gh workflow run docker.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
