name: u1-converter
services:
  u1-converter:
    image: ghcr.io/kitkat0981/u1-converter:latest
    container_name: u1-converter
    restart: unless-stopped
    ports:
      - "8765:80"
    labels:
      # Lets a Watchtower started with --label-enable update this container.
      com.centurylinklabs.watchtower.enable: "true"
